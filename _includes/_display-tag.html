<div id="s1">
    <input id="search-input" 
           type="search" 
           aria-label="search" 
           autocomplete="off" 
           placeholder="Search...">

<div id="search-results"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const window = document.getElementById("search-results");
    const cat = document.getElementById("q-tag");

});
</script>
