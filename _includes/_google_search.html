<script language="Javascript" type="text/javascript">
    document.addEventListener('DOMContentLoaded', () => {
        SimpleJekyllSearch({
            searchInput: document.getElementById('search-input'),
            resultsContainer: document.getElementById('search-results'),
            json: '/DC-LX/assets/js/data/search.json',
            searchResultTemplate: '<article class="px-1 px-sm-2 px-lg-4 px-xl-0"><header><h2><a href="{url}">{title}</a></h2><div class="post-meta d-flex flex-column flex-sm-row text-muted mt-1 mb-1"> {categories} {tags}</div></header></article>',
            noResultsText: '<p class="mt-5">Oops! No results found.</p>',
			fuzzy: true,
            templateMiddleware: function(prop, value, template) {
                if (prop === 'categories') {
                    if (value === '') {
                        return `${value}`;
                    } else {
                        return `<div class="me-sm-4"><i class="far fa-folder fa-fw"></i>${value}</div>`;
                    }
                }
                if (prop === 'tags') {
                    if (value === '') {
                        return `${value}`;
                    } else {
                        return `<div><i class="fa fa-tag fa-fw"></i>${value}</div>`;
                    }
                }
            }
        });
    });
</script>
