<script src="/DC-LX/assets/simple-jekyll-search/simple-jekyll-search.min.js"></script>

<div id="s1">
    <input id="search-input" 
           type="search" 
           aria-label="search" 
           autocomplete="off" 
           placeholder="Search...">
</div>

<div id="search-results"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    SimpleJekyllSearch({
        searchInput: document.getElementById('search-input'),
        resultsContainer: document.getElementById('search-results'),
        json: '/DC-LX/assets/js/data/search.json',
        searchResultTemplate: '<article><header><h2><a href="{url}">{title}</a></h2><div class="post-meta">{categories} {tags}</div></header></article>',
        noResultsText: '<p>No results found.</p>',
        fuzzy: false
    });
});
</script>
